<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Edu - Institutional Console Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS Styles -->
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 40%),
                        var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 420px;
            max-width: 90%;
            border-radius: 24px;
            padding: 2.5rem;
        }
        .brand-logo-large {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), #ec4899);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.75rem;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 10px 20px -4px rgba(99, 102, 241, 0.4);
            animation: pulseLogo 3s infinite alternate;
        }
        @keyframes pulseLogo {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="glass-card login-card text-center">
        <!-- Logo -->
        <div class="brand-logo-large">
            <i class="fas fa-brain"></i>
        </div>
        
        <h3 class="font-weight-bold mb-1">Welcome to Smart Edu</h3>
        <p class="text-secondary small mb-4">Enter credentials to access the management system</p>

        <!-- Alerts -->
        <div id="alert-container"></div>

        <!-- Login Form -->
        <form action="/login" method="POST" class="text-start">
            <div class="mb-3">
                <label class="form-label small text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text border-glass bg-glass text-muted"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control form-control-premium" placeholder="e.g. admin" required autocomplete="username">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label small text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text border-glass bg-glass text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control form-control-premium" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-premium w-100 py-2.5 mb-3">
                <i class="fas fa-sign-in-alt me-2"></i> Log In
            </button>
        </form>

        <div class="text-center mt-3 border-top border-glass pt-3">
            <span class="text-muted small">Default Demo Accounts:</span>
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-2 demo-accounts-list">
                <span class="badge bg-primary-light text-primary">admin / admin123</span>
                <span class="badge bg-primary-light text-primary">faculty / faculty123</span>
                <span class="badge bg-primary-light text-primary">student / student123</span>
            </div>
        </div>
    </div>

    <script>
        // Check URL Parameters to display alert messages
        const params = new URLSearchParams(window.location.search);
        const alertContainer = document.getElementById('alert-container');

        if (params.has('error')) {
            alertContainer.innerHTML = `
                <div class="alert alert-danger alert-premium-danger py-2 px-3 small border-0 text-start d-flex align-items-center gap-2">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Invalid username or password. Please try again.</span>
                </div>
            `;
        } else if (params.has('logout')) {
            alertContainer.innerHTML = `
                <div class="alert alert-success alert-premium-success py-2 px-3 small border-0 text-start d-flex align-items-center gap-2">
                    <i class="fas fa-check-circle"></i>
                    <span>You have been signed out successfully.</span>
                </div>
            `;
        }
    </script>
</body>
</html>
