<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Edu - Institutional Management Console</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS Styles -->
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <!-- Sidebar Navigation Drawer -->
        <aside class="sidebar glass-panel">
            <div class="brand-section">
                <div class="brand-logo">
                    <i class="fas fa-brain"></i>
                </div>
                <div class="brand-name">Smart Edu</div>
            </div>
            
            <ul class="nav-menu" id="sidebar-menu">
                <!-- Dynamically populated by app.js based on role -->
            </ul>
            
            <div class="sidebar-footer">
                <form action="/logout" method="POST" class="m-0">
                    <button type="submit" class="btn btn-outline-secondary w-100">
                        <i class="fas fa-sign-out-alt me-2"></i> Logout
                    </button>
                </form>
            </div>
        </aside>
        
        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Top Header Action Bar -->
            <header class="top-header">
                <div class="page-title">
                    <h1 class="mb-0 text-gradient">Smart Edu Panel</h1>
                    <p class="text-secondary small mb-0">Role-based Management System integrated with Python ML Engine</p>
                </div>
                
                <div class="header-actions">
                    <!-- Theme Toggle Switch -->
                    <button class="theme-toggle-btn" id="theme-toggle" title="Toggle Light/Dark Mode">
                        <i class="fas fa-moon"></i>
                    </button>
                    
                    <!-- Profile Info badge -->
                    <div class="profile-badge">
                        <div class="profile-avatar" id="profile-avatar">S</div>
                        <div class="text-start">
                            <span class="font-weight-bold d-block text-primary small" id="profile-name">Guest</span>
                            <span class="text-muted" id="profile-role">STUDENT</span>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- Dynamic Content Load Mount -->
            <div id="main-content-area">
                <!-- Loaded dynamically by app.js -->
            </div>
            
        </main>
        
    </div>

    <!-- Floating AI Chatbot Widget -->
    <div class="chatbot-widget">
        <!-- Floating Activation Button -->
        <div class="chatbot-btn" onclick="toggleChatbot()" id="chatbot-trigger" title="Ask AI Chatbot">
            <i class="fas fa-comment-dots"></i>
        </div>
        
        <!-- Chatbot Drawer Window -->
        <div class="chatbot-panel glass-panel" id="chatbot-panel">
            <div class="chatbot-header">
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-robot"></i>
                    <h6 class="mb-0 font-weight-bold">Smart AI Assistant</h6>
                </div>
                <button type="button" class="btn-close btn-close-white" onclick="toggleChatbot()" aria-label="Close"></button>
            </div>
            
            <div class="chatbot-messages" id="chat-messages">
                <!-- Bubble chats go here -->
            </div>
            
            <div class="chatbot-input-area">
                <input type="text" id="chat-input" placeholder="Ask about fees, grades, timetables..." autocomplete="off">
                <button onclick="sendChatMessage()" title="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bootstrap Bundle with Popper CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application Logic Script -->
    <script src="/js/app.js"></script>

</body>
</html>
